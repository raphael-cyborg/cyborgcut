name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  teste:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # modelo pequeno só pro CI: o que se testa é a cadeia, não a qualidade da transcrição
      CYBORGCUT_FASTER_MODEL: small
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      # setup-ffmpeg só tem build x64; o runner do Mac hoje é arm64, então lá vai pelo Homebrew
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
        with:
          ffmpeg-version: release

      - name: ffmpeg (Homebrew)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: ambiente
        run: |
          uv venv --clear
          uv pip install -e ".[cpu,dev]"

      - name: doctor
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python scripts/cyborgcut.py doctor

      - name: testes de unidade
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -q tests

      - name: fixture de ponta a ponta (preparar, montar)
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python scripts/cyborgcut.py estilo opcoes > /dev/null
          python scripts/cyborgcut.py preparar tests/fixtures/projeto
          python scripts/cyborgcut.py montar tests/fixtures/projeto --nome ci.mp4
          python scripts/cyborgcut.py montar tests/fixtures/projeto --nome ci-impacto.mp4 --estilo impacto

      - name: conferir (com o modelo pequeno a retranscrição pode divergir; não derruba o CI)
        shell: bash
        continue-on-error: true
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python scripts/cyborgcut.py conferir tests/fixtures/projeto --video tests/fixtures/projeto/saida/ci.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saida-${{ matrix.os }}
          path: |
            tests/fixtures/projeto/saida/*.mp4
            tests/fixtures/projeto/saida/*.md
            tests/fixtures/projeto/trabalho/catalogo.md
          if-no-files-found: ignore
